# State machine do Checkpoint 3 — Amazon States Language em YAML.
#
# Este arquivo e a fonte da verdade do fluxo, e nao um subproduto:
#
#   - o Terraform o le com templatefile + yamldecode e envia o JSON
#     equivalente para o Step Functions (infra/statemachine.tf);
#   - o simulador local o interpreta com o mesmo conteudo (local/engine.py).
#
# Por isso ele nao pode divergir do que roda: tests/test_asl_definition.py
# falha se algum estado usar construcao que o simulador nao suporte, e
# tests/test_workflow_engine.py cobre o interpretador.
#
# Os marcadores $${...} sao substituidos pelo Terraform no apply (o $$ duplo e
# como o templatefile escapa um cifrao literal — aqui, dentro de um comentario).
# O simulador resolve os mesmos nomes contra os handlers em processo: e por isso
# que o marcador vive no arquivo, em vez de o ARN ser injetado por outro caminho.

Comment: >-
  Resolve uma equacao do segundo grau compondo funcoes independentes:
  valida os coeficientes, calcula o discriminante, escolhe o caminho conforme o
  sinal, calcula as raizes e persiste o resultado de forma idempotente.

StartAt: Validate

States:

  # ---------------------------------------------------------------- Validate
  Validate:
    Type: Task
    Comment: Normaliza e valida os coeficientes. Erro aqui e permanente.
    Resource: "${validate_arn}"
    Parameters:
      equation.$: "$.equation"
      meta.$: "$.meta"
      # O par abaixo vai em toda Task. $$.State.Name diz a funcao em qual
      # estado ela esta rodando — o mesmo handler atende tres estados no caso
      # das raizes — e $$.State.RetryCount torna a falha injetada
      # deterministica: a funcao sabe em qual tentativa esta sem guardar estado.
      state.$: "$$.State.Name"
      retry_count.$: "$$.State.RetryCount"
    ResultPath: "$.validated"
    Retry: &retry
      # A ordem importa: o Step Functions usa o primeiro retrier que casa com o
      # erro. InvalidEquation tambem casaria com States.TaskFailed abaixo, e
      # seria reentregue tres vezes sem qualquer chance de sucesso.
      - ErrorEquals:
          - InvalidEquation
        MaxAttempts: 0

      # Throttling tem retrier proprio, e mais paciente que o generico.
      #
      # Isto nao e teoria: no primeiro deploy, 6 das 7 mensagens que foram
      # parar na dead-letter eram equacoes perfeitamente validas que esgotaram
      # 3 tentativas em 1s, 2s e 4s enquanto a conta estava saturada. A conta
      # tem 10 execucoes Lambda concorrentes no total, e cada execucao desta
      # state machine invoca ate cinco funcoes — dezenas de execucoes ao mesmo
      # tempo pedem mais concorrencia do que existe.
      #
      # Esperar mais e a resposta certa: a fila nao tem pressa, e uma equacao
      # recusada por falta de concorrencia e um resultado errado. Com 6
      # tentativas a 2s, 4s, 8s, 16s, 32s e 64s, a janela de espera passa de 7
      # segundos para dois minutos.
      - ErrorEquals:
          - Lambda.TooManyRequestsException
        IntervalSeconds: 2
        MaxAttempts: 6
        BackoffRate: 2
        JitterStrategy: FULL

      - ErrorEquals:
          - TransientFailure
          - Lambda.ServiceException
          - Lambda.AWSLambdaException
          - Lambda.SdkClientException
          - States.TaskFailed
          - States.Timeout
        IntervalSeconds: 1
        MaxAttempts: 3
        BackoffRate: 2
        JitterStrategy: FULL
    Catch: &catch
      # Depois de esgotado o Retry, qualquer erro leva ao mesmo lugar. O
      # ResultPath preserva a entrada e anexa { Error, Cause } em $.error —
      # e o que a mensagem da dead-letter carrega como motivo.
      - ErrorEquals:
          - States.ALL
        ResultPath: "$.error"
        Next: DeadLetter
    Next: Delta

  # ------------------------------------------------------------------- Delta
  Delta:
    Type: Task
    Comment: Calcula b^2 - 4ac e classifica o sinal para o Choice seguinte.
    Resource: "${delta_arn}"
    Parameters:
      validated.$: "$.validated"
      meta.$: "$.meta"
      state.$: "$$.State.Name"
      retry_count.$: "$$.State.RetryCount"
    ResultPath: "$.delta"
    Retry: *retry
    Catch: *catch
    Next: ChooseRoots

  # ------------------------------------------------------------- ChooseRoots
  #
  # O roteamento compara a palavra que o estado Delta produziu, e nao o numero.
  # Um NumericGreaterThan aqui funcionaria, mas espalharia a regra "delta zero
  # significa raiz dupla" entre o codigo e a definicao do fluxo. Do jeito
  # abaixo, a state machine so roteia — quem sabe matematica e o codigo, e o
  # YAML fica legivel para quem nunca viu Bhaskara.
  ChooseRoots:
    Type: Choice
    Comment: Um caminho para cada sinal do discriminante.
    Choices:
      - Variable: "$.delta.sign"
        StringEquals: positive
        Next: RootsInParallel
      - Variable: "$.delta.sign"
        StringEquals: zero
        Next: RootDouble
    Default: NoRealRoots

  # -------------------------------------------------------- RootsInParallel
  #
  # Delta > 0: duas raizes distintas, cada uma calculada em seu ramo. Ver o
  # cabecalho de src/handlers/root/handler.py — a divisao e para demonstrar o
  # Parallel, nao para ganhar tempo.
  RootsInParallel:
    Type: Parallel
    Comment: Calcula x1 e x2 em ramos concorrentes.
    Branches:
      - StartAt: RootX1
        States:
          RootX1:
            Type: Task
            Resource: "${root_arn}"
            Parameters:
              label: x1
              validated.$: "$.validated"
              delta.$: "$.delta"
              meta.$: "$.meta"
              state.$: "$$.State.Name"
              retry_count.$: "$$.State.RetryCount"
            Retry: *retry
            End: true
      - StartAt: RootX2
        States:
          RootX2:
            Type: Task
            Resource: "${root_arn}"
            Parameters:
              label: x2
              validated.$: "$.validated"
              delta.$: "$.delta"
              meta.$: "$.meta"
              state.$: "$$.State.Name"
              retry_count.$: "$$.State.RetryCount"
            Retry: *retry
            End: true
    # A saida de um Parallel e a lista das saidas dos ramos, na ordem em que os
    # ramos foram declarados. O ResultSelector so lhe da nome, para que os tres
    # caminhos entreguem a mesma forma ao Persist: { "roots": [...] }.
    ResultSelector:
      roots.$: "$"
    ResultPath: "$.result"
    # O Catch fica no Parallel, e nao dentro dos ramos: em ASL, o Next de um
    # estado so pode apontar para estados do mesmo nivel, e DeadLetter e de
    # fora. A falha de um ramo falha o Parallel, que entao e capturado aqui.
    Catch: *catch
    Next: Persist

  # -------------------------------------------------------------- RootDouble
  #
  # Delta = 0: as duas raizes sao o mesmo numero. Abrir um Parallel para
  # calcular duas vezes o mesmo valor seria desperdicio sem ganho didatico.
  RootDouble:
    Type: Task
    Comment: Raiz dupla, calculada uma vez so.
    Resource: "${root_arn}"
    Parameters:
      label: double
      validated.$: "$.validated"
      delta.$: "$.delta"
      meta.$: "$.meta"
      state.$: "$$.State.Name"
      retry_count.$: "$$.State.RetryCount"
    ResultSelector:
      roots.$: "States.Array($)"
    ResultPath: "$.result"
    Retry: *retry
    Catch: *catch
    Next: Persist

  # ------------------------------------------------------------- NoRealRoots
  #
  # Delta < 0: nao ha o que calcular. Um Pass, e nao uma Lambda: invocar uma
  # funcao para devolver uma lista vazia seria custo e latencia por nada.
  NoRealRoots:
    Type: Pass
    Comment: Sem raizes reais.
    Result:
      roots: []
    ResultPath: "$.result"
    Next: Persist

  # ----------------------------------------------------------------- Persist
  #
  # Segunda camada de idempotencia: escrita condicional. Se o item ja existe, o
  # estado nao falha — "ja estava gravado" e desfecho de sucesso, e trata-lo
  # como erro mandaria para a dead-letter uma execucao que fez a coisa certa.
  Persist:
    Type: Task
    Comment: Grava o resultado uma unica vez, por chave de idempotencia.
    Resource: "${persist_arn}"
    Parameters:
      validated.$: "$.validated"
      delta.$: "$.delta"
      result.$: "$.result"
      meta.$: "$.meta"
      state.$: "$$.State.Name"
      retry_count.$: "$$.State.RetryCount"
    ResultPath: "$.persisted"
    Retry: *retry
    Catch: *catch
    Next: Done

  # --------------------------------------------------------------- DeadLetter
  #
  # Integracao direta com a SQS: nao ha Lambda neste caminho. Sao duas razoes.
  #
  # A conta tem 10 execucoes concorrentes no total, compartilhadas com os
  # checkpoints anteriores — uma funcao a menos no caminho de erro e
  # concorrencia preservada para o caminho feliz, justamente quando as coisas
  # ja estao indo mal.
  #
  # E o caminho de erro precisa ser o mais simples possivel: uma funcao que
  # falhasse ao registrar a falha transformaria um problema visivel em uma
  # mensagem perdida.
  DeadLetter:
    Type: Task
    Comment: Publica a mensagem recusada com o motivo anexado.
    Resource: "arn:aws:states:::sqs:sendMessage"
    Parameters:
      QueueUrl: "${dead_letter_url}"
      MessageBody:
        # `source` distingue esta mensagem das que chegam pela DLQ nativa da
        # fila orders, quando e o proprio dispatcher que falha. As duas caem
        # na mesma fila, e o painel precisa saber de onde vieram.
        source: workflow
        equation.$: "$.equation"
        meta.$: "$.meta"
        error.$: "$.error"
        execution.$: "$$.Execution.Name"
      MessageAttributes:
        # O motivo tambem como atributo: a DLQ nativa da SQS move o payload
        # original sem dizer por que, e um operador olhando a fila precisa ver
        # o motivo sem abrir o corpo de cada mensagem.
        RejectionReason:
          DataType: String
          StringValue.$: "$.error.Error"
    ResultPath: "$.dead_letter"
    Retry:
      - ErrorEquals:
          - States.ALL
        IntervalSeconds: 2
        MaxAttempts: 3
        BackoffRate: 2
    Next: Rejected

  # Falhar de proposito no fim: a execucao aparece como FAILED no console e no
  # painel. Terminar em Succeed esconderia a recusa em uma lista de sucessos.
  Rejected:
    Type: Fail
    Error: EquationNotProcessed
    Cause: A equacao foi enviada para a fila dead-letter com o motivo anexado.

  # -------------------------------------------------------------------- Fim
  Done:
    Type: Succeed
